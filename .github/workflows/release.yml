# Builds, tests and publishes a release.
#
#   Push a version tag:        git tag v2.0.0-alpha.4 && git push origin v2.0.0-alpha.4
#   …or run it by hand:        Actions → Release → Run workflow → enter the version
#
# The tag is the version: the app, the zip (WindowsGSM-<version>.zip) and its .sha256 all get it, so there's
# nothing to edit first. A version with a dash (2.0.0-alpha.4, 2.1.0-beta.1) is published as a pre-release;
# installed copies offer pre-releases only when "include pre-releases" is on in Agent settings → Updates.
# The release text is the version's "## <version>" section of CHANGELOG.md (installed copies show it as "What's
# new"), so write that section before tagging — a release without one is refused.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.0.0-alpha.4 (a tag v<version> is created on this commit)"
        required: true

permissions:
  contents: write # create the release and upload its files
  actions: read   # see whether "Build and test" already passed on this commit

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes compare with the previous tag

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          $v = $v.Trim().TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "'$v' isn't a version like 2.0.0 or 2.0.0-alpha.4" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($v.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing WindowsGSM $v"

      - name: Release notes
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $changelog = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($changelog, '(?ms)^## ' + [regex]::Escape($v) + '[ \t]*\r?\n(.*?)(?=^## |\z)')
          if (-not $m.Success -or $m.Groups[1].Value.Trim().Length -eq 0) { throw "CHANGELOG.md has no '## $v' section. Write what changed there, then release again." }
          $notes = $m.Groups[1].Value.Trim() + "`n`n---`n`n" +
            "**Updating:** in WindowsGSM, Agent settings → Updates → Check now (with *Include pre-releases* on for alpha and beta versions). Game servers keep running.`n`n" +
            "**New install:** download ``WindowsGSM-$v.zip`` below, extract it, and run ``WindowsGSM.exe``. See [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/v$v/docs/INSTALL.md)."
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          Write-Host $notes

      # The commit being released was normally just pushed to main, so "Build and test" has run (or is running)
      # on exactly this code: use that result rather than testing the same thing twice. Only when it didn't pass
      # (or never ran — a hand-started release of some other commit) are the tests run here.
      - name: Check the commit's tests
        id: tested
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}"
          $deadline = (Get-Date).AddMinutes(40)
          while ($true) {
            $runs = gh run list --workflow ci.yml --commit $sha --json databaseId,status,conclusion --limit 10 | ConvertFrom-Json
            if ($runs | Where-Object { $_.conclusion -eq "success" }) { Write-Host "Build and test passed on $sha."; "passed=true" >> $env:GITHUB_OUTPUT; exit 0 }
            $running = $runs | Where-Object { $_.status -ne "completed" }
            if (-not $running -or (Get-Date) -gt $deadline) { break }
            Write-Host "Build and test is still running on $sha — waiting for it."
            Start-Sleep -Seconds 30
          }
          Write-Host "No passing Build and test run on $sha — testing here."
          "passed=false" >> $env:GITHUB_OUTPUT

      - name: Test
        if: steps.tested.outputs.passed != 'true'
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) { dotnet restore WindowsGSM.Next.sln --nologo; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds (15 * $attempt) }
          dotnet build WindowsGSM.Next.sln -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw "The build failed — nothing was released." }
          dotnet test tests/WindowsGSM.Core.Tests -c Release --no-build --nologo --blame-hang-timeout 10m
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed — nothing was released." }
          dotnet test tests/WindowsGSM.Agent.Tests -c Release --no-build --nologo --blame-hang-timeout 10m
          if ($LASTEXITCODE -ne 0) { throw "Agent tests failed — nothing was released." }

      - name: Build the package
        shell: pwsh
        run: ./tools/publish.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $zip = "dist/WindowsGSM-$v.zip"
          $ghArgs = @("release", "create", "v$v", $zip, "$zip.sha256", "--title", "WindowsGSM $v", "--notes-file", "release-notes.md", "--target", "${{ github.sha }}")
          if ("${{ steps.version.outputs.prerelease }}" -eq "true") { $ghArgs += "--prerelease" }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "Couldn't create the release (does v$v already exist?)" }
